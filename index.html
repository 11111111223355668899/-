        /* -------------------------------------------------------------
           2. SEEDED RANDOM GENERATOR (FOR DETERMINISTIC DAILY RESULTS)
        ------------------------------------------------------------- */
        function getDailySeed(zodiacIndex) {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const dateStr = `${year}${month}${day}`;
            return parseInt(dateStr, 10) * 100 + zodiacIndex;
        }

        // Pseudo-random number generator (Mulberry32)
        function pseudoRandom(seed) {
            let t = seed += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }

        /* -------------------------------------------------------------
           4. ZODIAC CALCULATION LOGIC
        ------------------------------------------------------------- */
        function getZodiacSign(month, day) {
            // Check boundary conditions
            if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return 3; // 牡羊
            if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return 4; // 金牛
            if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) return 5; // 雙子
            if ((month === 6 && day >= 21) || (month === 7 && day <= 22)) return 6; // 巨蟹
            if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return 7; // 獅子
            if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return 8; // 處女
            if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) return 9; // 天秤
            if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) return 10; // 天蠍
            if ((month === 11 && day >= 22) || (month === 12 && day <= 21)) return 11; // 射手
            if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return 0; // 摩羯
            if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return 1; // 水瓶
            if ((month === 2 && day >= 19) || (month === 3 && day <= 20)) return 2; // 雙魚
            return 0; // default
        }

        /* -------------------------------------------------------------
           5. UI RENDER FUNCTIONS
        ------------------------------------------------------------- */
        function generateStarHTML(rating) {
            let html = '';
            for (let i = 1; i <= 5; i++) {

        let currentResultSummary = '';

        function renderHoroscope(zodiacIdx) {
            const zodiac = ZODIAC_SIGNS[zodiacIdx];
            const seed = getDailySeed(zodiacIdx);

            // Pseudo-random index generators
            let rCount = 0;
            function rand() {
                rCount++;
                return pseudoRandom(seed + rCount);
            }

            // Star ratings (3 to 5 stars for positive aesthetic)
            const overallRating = Math.floor(rand() * 3) + 3; // 3 - 5
            const loveRating = Math.floor(rand() * 3) + 3;
            const careerRating = Math.floor(rand() * 3) + 3;

            // Compatible sign (pick any other sign)

            document.getElementById('wealthText').textContent = wealthAdvice;

            document.getElementById('healthText').textContent = healthAdvice;

            // Lucky items

            document.getElementById('luckyColorName').textContent = luckyColorObj.name;
            document.getElementById('luckyNumber').textContent = luckyNum;
            document.getElementById('luckyDirection').textContent = luckyDir;
            document.getElementById('compatibleSign').textContent = compatibleZodiac;

            // Store summary for copying

            currentResultSummary = `【星宿指引 • 29劉 每日運勢】\n📅 日期：${todayStr}\n✨ 星座：${zodiac.name} (${zodiac.symbol})\n⭐ 綜合指數：${'★'.repeat(overallRating)}${'☆'.repeat(5 - overallRating)}\n\n📜 天象總評：${overallAdvice}\n❤️ 愛情運勢：${loveAdvice}\n💼 事業學業：${careerAdvice}\n💰 財富運勢：${wealthAdvice}\n\n🎨 幸運顏色：${luckyColorObj.name}\n🔢 幸運數字：${luckyNum}\n🧭 幸運方位：${luckyDir}\n💕 速配星座：${compatibleZodiac}`;

        /* -------------------------------------------------------------

            // Calculate Button Click Event
            document.getElementById('calculateBtn').addEventListener('click', () => {
                const dateVal = document.getElementById('birthdate').value;

                    showToast('請選擇您的生日日期！');

                const bDate = new Date(dateVal);
                const month = bDate.getMonth() + 1;
                const day = bDate.getDate();
                const signIndex = getZodiacSign(month, day);
                renderHoroscope(signIndex);
            });

            // Copy Share Button
            document.getElementById('copyShareBtn').addEventListener('click', () => {
                if (!currentResultSummary) return;
                
                // Compatibility for iframe clipboard copying
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(currentResultSummary).then(() => {
                        showToast('已成功複製運勢報告至剪貼簿！');
                    }).catch(() => {
                        fallbackCopyText(currentResultSummary);
                    });
                } else {
                    fallbackCopyText(currentResultSummary);
                }
            });

            // Initial auto calculation for default date
            const defaultDate = new Date(document.getElementById('birthdate').value);
            const defaultIndex = getZodiacSign(defaultDate.getMonth() + 1, defaultDate.getDate());
            renderHoroscope(defaultIndex);
        });

        function fallbackCopyText(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('已成功複製運勢報告！');
            } catch (err) {
                showToast('複製失敗，請手動選取文字');
            }
            document.body.removeChild(textArea);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        /* -------------------------------------------------------------
           7. STARFIELD CANVAS ANIMATION
        ------------------------------------------------------------- */
        const canvas = document.getElementById('starfieldCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 3000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.015 + 0.005,
                    color: Math.random() > 0.3 ? '#ffffff' : (Math.random() > 0.5 ? '#fbbf24' : '#c084fc')
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw subtle space nebula glow
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 3, 50,
                canvas.width / 2, canvas.height / 3, canvas.width * 0.7
            );
            gradient.addColorStop(0, 'rgba(139, 92, 246, 0.08)');
            gradient.addColorStop(0.5, 'rgba(15, 23, 42, 0.05)');
            gradient.addColorStop(1, 'rgba(7, 9, 19, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) {
                    star.speed = -star.speed;
                }
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color;
                ctx.globalAlpha = Math.max(0.1, Math.min(1, star.alpha));
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resizeCanvas);
        window.onload = function() {
            resizeCanvas();
            animateStars();
        };
    </script>
